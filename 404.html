<!--
  This 404.html file is for GitHub Pages SPA fallback.
  It will redirect all 404s to index.html so React Router can handle the route.
-->
<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <script>
      // GitHub Pages SPA fallback: redirect to index.html and preserve full path/query/hash
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        } else {
          var fullPath = location.pathname + location.search + location.hash;
          sessionStorage.redirect = fullPath;
          location.replace('./index.html');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
