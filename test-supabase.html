<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Data Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase Data Test</h1>
    <div id="results"></div>
    
    <script>
        const { createClient } = supabase;
        
        const supabaseUrl = 'http://127.0.0.1:54321';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0';
        
        const client = createClient(supabaseUrl, supabaseAnonKey);
        
        async function testData() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing connection...</p>';
            
            try {
                // Test properties
                const { data: properties, error: propertiesError } = await client
                    .from('properties')
                    .select('*');
                
                if (propertiesError) {
                    resultsDiv.innerHTML += `<p style="color: red;">Properties error: ${propertiesError.message}</p>`;
                    console.error('Properties error:', propertiesError);
                } else {
                    resultsDiv.innerHTML += `<p style="color: green;">✅ Properties: ${properties?.length || 0} found</p>`;
                    if (properties && properties.length > 0) {
                        const featured = properties.filter(p => p.featured);
                        resultsDiv.innerHTML += `<p>Featured properties: ${featured.length}</p>`;
                        resultsDiv.innerHTML += `<pre>${JSON.stringify(properties[0], null, 2)}</pre>`;
                    }
                }
                
                // Test profiles
                const { data: profiles, error: profilesError } = await client
                    .from('profiles')
                    .select('*');
                
                if (profilesError) {
                    resultsDiv.innerHTML += `<p style="color: red;">Profiles error: ${profilesError.message}</p>`;
                } else {
                    resultsDiv.innerHTML += `<p style="color: green;">✅ Profiles: ${profiles?.length || 0} found</p>`;
                }
                
                // Test realtors
                const { data: realtors, error: realtorsError } = await client
                    .from('realtors')
                    .select('*');
                
                if (realtorsError) {
                    resultsDiv.innerHTML += `<p style="color: red;">Realtors error: ${realtorsError.message}</p>`;
                } else {
                    resultsDiv.innerHTML += `<p style="color: green;">✅ Realtors: ${realtors?.length || 0} found</p>`;
                }
                
            } catch (error) {
                resultsDiv.innerHTML += `<p style="color: red;">Test failed: ${error.message}</p>`;
                console.error('Test failed:', error);
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testData);
    </script>
</body>
</html>
